services:
  - type: worker
    name: telegram-bot-oswaldo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot_memoria.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
